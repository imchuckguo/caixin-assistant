<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>采芯助手</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 392px;
      }
      .wrap {
        padding: 16px;
      }
      .head {
        padding: 16px 20px;
      }
      .head b {
        font-size: 18px;
      }
      .quick {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 16px 0;
      }
      .quick button {
        padding: 12px 8px;
      }
      .row select {
        width: 132px;
      }
      .row b {
        font-weight: 500;
      }
      .card {
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <header class="head">
      <img src="icons/128.png" class="brand-mark" alt="" />
      <div>
        <b>采芯助手</b>
        <div class="sub">采购台账 · <span id="ver"></span></div>
      </div>
    </header>
    <main class="wrap">
      <div id="stale" class="notice hidden">
        <b>后台未就绪</b>
        <p id="staleText"></p>
        <button id="openExt">打开扩展管理</button>
      </div>
      <div class="quick">
        <button class="primary" id="recordsBtn">
          询价记录 <span id="logCount" class="number">0</span></button
        ><button id="watchPage">
          库存监控 <span id="watchCount" class="number">0</span>
        </button>
      </div>
      <section class="card">
        <h4>采购工具</h4>
        <div class="row">
          <span
            ><b>QQ 号码助手</b><br /><span class="muted"
              >复制号码并区分企业与私人号</span
            ></span
          ><input aria-label="QQ 号码助手" type="checkbox" id="qqCopy" />
        </div>
        <div class="row">
          <label for="personalQQ">私人 QQ</label
          ><select id="personalQQ">
            <option value="copy">仅复制号码</option>
            <option value="open">打开聊天框</option>
          </select>
        </div>
        <div class="row">
          <label for="hideAds">精简网站页面</label
          ><input type="checkbox" id="hideAds" />
        </div>
        <div class="row">
          <label for="darkMode">网站深色模式</label
          ><select id="darkMode">
            <option value="off">关闭</option>
            <option value="auto">跟随系统</option>
            <option value="on">开启</option>
          </select>
        </div>
      </section>
      <section class="card">
        <div class="row">
          <span
            ><b>自动货源对比</b><br /><span class="muted"
              >查询会将料号发给勾选的网站</span
            ></span
          ><input aria-label="自动货源对比" type="checkbox" id="autoTabs" />
        </div>
        <div class="srcs">
          <label><input type="checkbox" data-src="szlcsc" />立创</label
          ><label><input type="checkbox" data-src="ickey" />云汉</label
          ><label><input type="checkbox" data-src="bomman" />圣禾堂</label
          ><label><input type="checkbox" data-src="mouser" />贸泽</label
          ><label><input type="checkbox" data-src="digikey" />得捷</label
          ><label><input type="checkbox" data-src="taobao" />淘宝</label
          ><label><input type="checkbox" data-src="ti" />TI 官网</label>
        </div>
      </section>
      <section class="card">
        <div class="row">
          <b>团队协作</b><button id="teamBtn">团队设置</button>
        </div>
        <p id="teamState" class="muted">未连接 · 数据保存在本机</p>
      </section>
      <section class="card">
        <div class="row">
          <label for="watchMinutes">监控间隔</label
          ><select id="watchMinutes">
            <option value="30">30 分钟</option>
            <option value="60">1 小时</option>
            <option value="120">2 小时</option>
            <option value="240">4 小时</option>
            <option value="720">12 小时</option>
            <option value="1440">每天</option>
          </select>
        </div>
        <div class="row">
          <button id="checkNow">检查库存</button
          ><button id="accountsBtn">网站查询状态</button>
        </div>
        <p id="status" class="muted" role="status"></p>
      </section>
      <footer class="footer">
        默认本地使用，共享由你开启<br /><a
          href="https://github.com/imchuckguo/caixin-assistant"
          target="_blank"
          rel="noopener"
          >源码与隐私说明</a
        >
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
